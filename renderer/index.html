<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>KeyHub · API Key 聚合 & 余额查询</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔑</span>
      <h1>KeyHub <span class="version" id="app-version">v1.0.0</span></h1>
    </div>
    <div class="actions">
      <button id="check-update" class="btn btn-icon" title="检查更新">🔄</button>
      <button id="refresh-all" class="btn btn-primary">↻ 刷新全部</button>
      <button id="add-key" class="btn">+ 添加 Key</button>
    </div>
  </header>

  <!-- 更新提示条 -->
  <div id="update-bar" class="update-bar">
    <div class="update-text">
      <span>🚀 发现新版本</span>
      <span class="ver" id="update-version"></span>
    </div>
    <div style="display:flex;align-items:center;">
      <div id="update-progress-wrap" class="update-progress" style="display:none;">
        <div id="update-progress-bar" class="update-progress-bar" style="width:0%"></div>
      </div>
      <span id="update-pct" class="update-pct" style="display:none;"></span>
      <button id="update-action" class="btn btn-primary btn-sm" style="margin-left:12px;">下载中...</button>
    </div>
  </div>

  <!-- 聚合代理控制区 -->
  <section class="proxy-bar">
    <div class="proxy-status">
      <span id="proxy-dot" class="status-dot stopped"></span>
      <span id="proxy-status-text">代理未启动</span>
    </div>
    <div class="proxy-config">
      <label>端口</label>
      <input type="number" id="proxy-port" value="9527" min="1" max="65535" class="port-input" />
      <button id="proxy-toggle" class="btn btn-primary btn-sm">启动代理</button>
    </div>
    <div id="proxy-info" class="proxy-info hidden">
      <div class="key-display">
        <label>统一 API Key</label>
        <div class="key-row">
          <input type="text" id="unified-key" readonly />
          <button id="copy-key" class="btn btn-sm" title="复制 Key">📋</button>
          <button id="regen-key" class="btn btn-sm" title="重新生成">🔄</button>
        </div>
      </div>
      <div class="endpoint-display">
        <label>端点地址</label>
        <code id="proxy-endpoint">http://127.0.0.1:9527/v1</code>
      </div>
    </div>
  </section>

  <main class="content">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📋</div>
      <p>还没有添加任何 API Key</p>
      <button id="empty-add" class="btn btn-primary">添加第一个 Key</button>
    </div>

    <div id="key-list" class="key-list"></div>
  </main>

  <!-- 添加/编辑对话框 -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title">添加 API Key</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <form id="key-form" class="modal-body">
        <div class="field">
          <label for="f-name">名称</label>
          <input type="text" id="f-name" placeholder="如：DeepSeek 主号" required />
        </div>

        <div class="field">
          <label for="f-provider">类型</label>
          <select id="f-provider"></select>
        </div>

        <div class="field">
          <label for="f-baseurl">Base URL</label>
          <input type="text" id="f-baseurl" placeholder="https://api.example.com" />
          <span id="f-baseurl-hint" class="hint"></span>
        </div>

        <div class="field">
          <label for="f-apikey">API Key</label>
          <input type="password" id="f-apikey" placeholder="sk-..." required />
        </div>

        <div id="custom-fields" class="custom-fields hidden">
          <div class="field">
            <label for="f-custom-path">余额接口路径</label>
            <input type="text" id="f-custom-path" placeholder="v1/dashboard/billing/credit_grants" />
          </div>
          <div class="field">
            <label for="f-custom-jsonpath">JSON 提取路径</label>
            <input type="text" id="f-custom-jsonpath" placeholder="如 data.balance 或 balance_infos.0.total_balance" />
            <span class="hint">用点号分隔，数组用下标</span>
          </div>
          <div class="field">
            <label for="f-custom-currency">货币单位</label>
            <input type="text" id="f-custom-currency" placeholder="CNY / USD" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn" id="modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="modal-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div id="confirm-dialog" class="confirm-dialog hidden">
    <div class="confirm-backdrop"></div>
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
