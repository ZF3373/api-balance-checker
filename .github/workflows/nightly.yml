name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron
          key: win-electron-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Set nightly version
        shell: bash
        run: |
          VERSION="1.0.0-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          node -e "const p=require('./package.json'); p.version=process.argv[1]; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2))" "$VERSION"
          echo "Nightly version: $VERSION"

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
