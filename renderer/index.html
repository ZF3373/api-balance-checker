<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>KeyHub · API Key 聚合 & 余额查询</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
      </span>
      <h1>KeyHub</h1>
      <span class="version" id="app-version">v1.0.0</span>
    </div>
    <div class="actions">
      <button id="check-update" class="btn btn-icon" title="检查更新">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <button id="refresh-all" class="btn btn-primary">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新全部
      </button>
      <button id="dedup-keys" class="btn" title="扫描并删除重复的 API Key">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>去重
      </button>
      <button id="add-key" class="btn">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>添加 Key
      </button>
    </div>
  </header>

  <!-- 更新提示条 -->
  <div id="update-bar" class="update-bar">
    <div class="update-text">
      <span>发现新版本</span>
      <span class="ver" id="update-version"></span>
    </div>
    <div style="display:flex;align-items:center;">
      <div id="update-progress-wrap" class="update-progress" style="display:none;">
        <div id="update-progress-bar" class="update-progress-bar" style="width:0%"></div>
      </div>
      <span id="update-pct" class="update-pct" style="display:none;"></span>
      <button id="update-action" class="btn btn-primary btn-sm" style="margin-left:12px;">下载中...</button>
    </div>
  </div>

  <!-- 聚合代理控制区 -->
  <section class="proxy-bar">
    <div class="proxy-status">
      <span id="proxy-dot" class="status-dot stopped"></span>
      <span id="proxy-status-text">代理未启动</span>
    </div>
    <div class="proxy-config">
      <label>端口</label>
      <input type="number" id="proxy-port" value="9527" min="1" max="65535" class="port-input" />
      <button id="proxy-toggle" class="btn btn-primary btn-sm">启动代理</button>
    </div>
    <div id="proxy-info" class="proxy-info hidden">
      <div class="key-display">
        <label>统一 API Key</label>
        <div class="key-row">
          <input type="text" id="unified-key" readonly />
          <button id="copy-key" class="btn btn-sm btn-icon" title="复制 Key">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
          <button id="regen-key" class="btn btn-sm btn-icon" title="重新生成">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>
        </div>
      </div>
      <div class="endpoint-display">
        <label>端点地址</label>
        <code id="proxy-endpoint">http://127.0.0.1:9527/v1</code>
      </div>
    </div>
  </section>

  <main class="content">
    <div id="empty-state" class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
      <p>还没有添加任何 API Key</p>
      <button id="empty-add" class="btn btn-primary">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>添加第一个 Key
      </button>
    </div>

    <div id="key-list" class="key-list"></div>
  </main>

  <!-- 添加/编辑对话框 -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title">添加 API Key</h2>
        <button class="modal-close" id="modal-close">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="key-form" class="modal-body">
        <!-- 模式切换 -->
        <div class="mode-tabs" id="mode-tabs">
          <button type="button" class="mode-tab active" data-mode="single">单个添加</button>
          <button type="button" class="mode-tab" data-mode="batch">批量导入</button>
        </div>

        <div class="field">
          <label for="f-provider">类型</label>
          <select id="f-provider"></select>
        </div>

        <div class="field">
          <label for="f-baseurl">Base URL</label>
          <input type="text" id="f-baseurl" placeholder="https://api.example.com" />
          <span id="f-baseurl-hint" class="hint"></span>
        </div>

        <!-- 单个模式字段 -->
        <div id="single-fields" class="mode-fields">
          <div class="field">
            <label for="f-name">名称</label>
            <input type="text" id="f-name" placeholder="如：DeepSeek 主号" />
          </div>
          <div class="field">
            <label for="f-apikey">API Key</label>
            <input type="password" id="f-apikey" placeholder="sk-..." />
          </div>
        </div>

        <!-- 批量模式字段 -->
        <div id="batch-fields" class="mode-fields hidden">
          <div class="field">
            <label for="f-name-prefix">名称前缀（可选）</label>
            <input type="text" id="f-name-prefix" placeholder="留空则用平台名，如 DeepSeek" />
            <span class="hint">导入后自动编号：前缀-1、前缀-2 …</span>
          </div>
          <div class="field">
            <label for="f-apikeys">API Keys（每行一个）</label>
            <textarea id="f-apikeys" rows="6" placeholder="sk-aaa&#10;sk-bbb&#10;sk-ccc"></textarea>
            <span class="hint" id="batch-count"></span>
          </div>
        </div>

        <div id="custom-fields" class="custom-fields hidden">
          <div class="field">
            <label for="f-custom-path">余额接口路径</label>
            <input type="text" id="f-custom-path" placeholder="v1/dashboard/billing/credit_grants" />
          </div>
          <div class="field">
            <label for="f-custom-jsonpath">JSON 提取路径</label>
            <input type="text" id="f-custom-jsonpath" placeholder="如 data.balance 或 balance_infos.0.total_balance" />
            <span class="hint">用点号分隔，数组用下标</span>
          </div>
          <div class="field">
            <label for="f-custom-currency">货币单位</label>
            <input type="text" id="f-custom-currency" placeholder="CNY / USD" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn" id="modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="modal-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div id="confirm-dialog" class="confirm-dialog hidden">
    <div class="confirm-backdrop"></div>
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
