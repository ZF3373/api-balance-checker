name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron
          key: win-electron-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Set nightly version and tag
        id: version
        shell: bash
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          VERSION="1.0.0-nightly.$(date -u +%Y%m%d).${SHA_SHORT}"
          TAG="v${VERSION}"
          node -e "const p=require('./package.json'); p.version=process.argv[1]; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2))" "$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Nightly version: $VERSION, tag: $TAG"

      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }} || true
          git push origin ${{ steps.version.outputs.tag }} || true

      - name: Build (no publish)
        shell: bash
        run: npx electron-builder --win

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Create prerelease
          gh release create "$TAG" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Nightly build ${{ steps.version.outputs.version }}" \
            --prerelease \
            || gh release edit "$TAG" \
              --title "${{ steps.version.outputs.version }}" \
              --notes "Nightly build ${{ steps.version.outputs.version }}" \
              --prerelease
          # Upload assets with retry
          for i in 1 2 3; do
            gh release upload "$TAG" \
              "dist/api-balance-checker-setup-${{ steps.version.outputs.version }}.exe" \
              "dist/api-balance-checker-setup-${{ steps.version.outputs.version }}.exe.blockmap" \
              "dist/latest.yml" \
              --clobber && break
            echo "Upload attempt $i failed, retrying in 10s..."
            sleep 10
          done
